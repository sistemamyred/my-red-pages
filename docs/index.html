<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscar productos — My-RED</title>
<meta name="description" content="Encuentra los productos disponibles en los negocios cercanos a ti. My-RED conecta clientes y comercios locales.">
<link rel="canonical" href="https://my-red.net/">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;color:#212121;background:#fafafa;line-height:1.5}
header{background:linear-gradient(135deg,#2E7D32,#4CAF50);color:#fff;padding:32px 16px;text-align:center}
header h1{font-size:1.8rem;margin-bottom:6px}
header p{opacity:.9;font-size:1rem;max-width:600px;margin:0 auto}
main{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){main{grid-template-columns:60% 40%}}
.buscador{display:flex;gap:8px;margin-bottom:16px;grid-column:1/-1}
.buscador input{flex:1;padding:14px 16px;border:1px solid #ccc;border-radius:8px;font-size:1rem}
.buscador button{padding:14px 24px;background:#2E7D32;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600}
.buscador button:hover{background:#1B5E20}
#mapa{width:100%;min-height:400px;border-radius:8px;overflow:hidden;background:#eee}
.resultados{min-height:200px}
.resultados h2{margin-bottom:12px;color:#2E7D32;font-size:1.2rem}
.negocio{background:#fff;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.negocio h3{font-size:1rem;margin-bottom:4px}
.negocio h3 a{color:#2E7D32;text-decoration:none}
.negocio .distancia{color:#666;font-size:.85rem;margin-bottom:8px}
.negocio .productos{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.negocio .productos li{background:#E8F5E9;color:#2E7D32;padding:3px 8px;border-radius:12px;font-size:.8rem}
.negocio .btn-ver{display:inline-block;background:#2E7D32;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:.85rem}
.estado{color:#666;text-align:center;padding:20px;font-size:.9rem}
footer{text-align:center;padding:32px 16px;color:#666;font-size:.85rem}
footer .legal{font-size:.75rem;color:#999;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>🔍 Buscar productos — My-RED</h1>
  <p>Encuentra lo que buscas en los negocios cercanos a ti</p>
</header>
<main>
  <form class="buscador" onsubmit="event.preventDefault(); buscar();">
    <input id="buscador" type="search" placeholder="Ej: arroz, leche, pan…" autocomplete="off">
    <button type="submit">Buscar</button>
  </form>
  <section>
    <div id="mapa"></div>
  </section>
  <aside class="resultados">
    <h2>Resultados</h2>
    <div id="lista" class="estado">Escribe algo para empezar.</div>
  </aside>
</main>
<footer>
  <p>My-RED facilita la conexión entre clientes y comercios locales.</p>
  <p class="legal">Los precios, stock y disponibilidad son responsabilidad de cada negocio.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
<script>
let fuse = null;
let indice = null;
let ubicacionCliente = null;
let map = null;
let markers = [];

function normalizar(s) {
  return String(s || '').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371000,toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(a)));
}

function initMapa() {
  if (map) return;
  map = new maplibregl.Map({
    container: 'mapa',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: ubicacionCliente ? [ubicacionCliente.lon, ubicacionCliente.lat] : [-70.65, -33.45],
    zoom: 11
  });
  if (ubicacionCliente) {
    new maplibregl.Marker({ color: '#1565C0' })
      .setLngLat([ubicacionCliente.lon, ubicacionCliente.lat])
      .setPopup(new maplibregl.Popup().setText('Tu ubicación'))
      .addTo(map);
  }
}

async function cargarIndice() {
  if (indice) return;
  try {
    let res = await fetch('indice.json');
    if (!res.ok) {
      console.warn('indice.json no disponible, intentando backup');
      res = await fetch('indice.backup.json');
    }
    if (!res.ok) throw new Error('Sin índice disponible');
    indice = await res.json();
    fuse = new Fuse(indice.productos, {
      keys: ['termino'],
      threshold: 0.4,
      ignoreLocation: true,
      minMatchCharLength: 2
    });
  } catch (e) {
    console.error('Error cargando índice:', e);
    document.getElementById('lista').innerHTML = '<p class="estado">No se pudo cargar el índice. Intenta más tarde.</p>';
  }
}

async function pedirUbicacion() {
  if (ubicacionCliente) return ubicacionCliente;
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      pos => {
        ubicacionCliente = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        resolve(ubicacionCliente);
      },
      () => resolve(null),
      { timeout: 5000, maximumAge: 600000 }
    );
  });
}

async function buscar() {
  const q = document.getElementById('buscador').value.trim();
  const lista = document.getElementById('lista');
  if (!q) { lista.innerHTML = '<p class="estado">Escribe algo para empezar.</p>'; return; }
  lista.innerHTML = '<p class="estado">Buscando…</p>';

  await cargarIndice();
  if (!fuse) { lista.innerHTML = '<p class="estado">Índice no disponible.</p>'; return; }

  await pedirUbicacion();
  initMapa();

  const resultados = fuse.search(normalizar(q), { limit: 100 });

  // Agrupar por negocio
  const grupos = {};
  for (const r of resultados) {
    const p = r.item;
    const neg = indice.negocios[p.negocio_id];
    if (!neg) continue;
    if (!grupos[p.negocio_id]) {
      grupos[p.negocio_id] = { negocio: neg, negocio_id: p.negocio_id, productos: [] };
    }
    grupos[p.negocio_id].productos.push(p.sku);
  }

  // Calcular distancias
  const listaGrupos = Object.values(grupos).map(g => ({
    ...g,
    distancia: ubicacionCliente
      ? haversine(ubicacionCliente.lat, ubicacionCliente.lon, g.negocio.lat, g.negocio.lon)
      : null
  }));

  if (ubicacionCliente) listaGrupos.sort((a, b) => a.distancia - b.distancia);
  else listaGrupos.sort((a, b) => a.negocio.nombre.localeCompare(b.negocio.nombre));

  if (listaGrupos.length === 0) {
    lista.innerHTML = '<p class="estado">No encontramos productos para "' + q + '". Prueba con otro término.</p>';
    markers.forEach(m => m.remove());
    markers = [];
    return;
  }

  // Limpiar markers
  markers.forEach(m => m.remove());
  markers = [];

  // Render
  lista.innerHTML = listaGrupos.map(g => {
    const prods = g.productos.slice(0, 8).map(s =>
      '<li>' + s.replace(/-/g, ' ').toLowerCase() + '</li>'
    ).join('');
    const dist = g.distancia !== null
      ? (g.distancia < 1000 ? 'a ' + g.distancia + ' m' : 'a ' + (g.distancia/1000).toFixed(1) + ' km')
      : '';
    return '<article class="negocio">' +
      '<h3><a href="/cl/' + g.negocio.slug + '/">' + g.negocio.nombre + '</a></h3>' +
      (dist ? '<p class="distancia">' + dist + '</p>' : '') +
      '<ul class="productos">' + prods + '</ul>' +
      '<a href="/cl/' + g.negocio.slug + '/" class="btn-ver">Ver negocio →</a>' +
      '</article>';
  }).join('');

  // Añadir markers
  for (const g of listaGrupos) {
    const marker = new maplibregl.Marker({ color: '#2E7D32' })
      .setLngLat([g.negocio.lon, g.negocio.lat])
      .setPopup(new maplibregl.Popup().setHTML('<strong>' + g.negocio.nombre + '</strong><br><a href="/cl/' + g.negocio.slug + '/">Ver negocio</a>'))
      .addTo(map);
    markers.push(marker);
  }

  // Ajustar vista
  if (listaGrupos.length > 0) {
    const bounds = new maplibregl.LngLatBounds();
    listaGrupos.forEach(g => bounds.extend([g.negocio.lon, g.negocio.lat]));
    if (ubicacionCliente) bounds.extend([ubicacionCliente.lon, ubicacionCliente.lat]);
    map.fitBounds(bounds, { padding: 60, maxZoom: 14 });
  }
}

document.getElementById('buscador').addEventListener('keypress', e => {
  if (e.key === 'Enter') buscar();
});
</script>
</body>
</html>
<!-- FIN DEL ARCHIVO -->
